{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Блог</h1>
            <a href="{% url 'blog:blog_create' %}" class="btn btn-primary">Создать новую статью</a>
        </div>
        <div class="row">
            {% for post in posts %}
                <div class="col-md-4">
                    <div class="card mb-4 box-shadow">
                        <img class="card-img-top" src="{{ post.preview | media_filter }}" alt="{{ post.title }}" width="100%">
                        <div class="card-body">
                            <h5 class="card-title">{{ post.title }}</h5>
                            <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a href="{% url 'blog:blog_detail' post.pk %}" class="btn btn-sm btn-outline-secondary">Подробнее</a>
                                </div>
                                <small class="text-muted">Просмотров: {{ post.counter_view }}</small>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
